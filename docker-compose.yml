version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=unibike
      - POSTGRES_PASSWORD=unibike_password
      - POSTGRES_DB=unibike_db
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - GRADIO_ADMIN_USERNAME=admin
      - GRADIO_ADMIN_PASSWORD=password
      - CHROMA_DB_DIR=/app/data/chroma
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - chroma_data:/app/data/chroma

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=unibike
      - POSTGRES_PASSWORD=unibike_password
      - POSTGRES_DB=unibike_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unibike -d unibike_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  chroma_data:
